spring:
  application:
    name: dazhongdianping-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${APP_DB_HOST:127.0.0.1}:${APP_DB_PORT:3306}/${APP_DB_NAME:dazhongdianping}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${APP_DB_USERNAME:root}
    password: ${APP_DB_PASSWORD:}
  data:
    redis:
      host: ${APP_REDIS_HOST:127.0.0.1}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}
      database: ${APP_REDIS_DATABASE:0}
      connect-timeout: ${APP_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${APP_REDIS_TIMEOUT:2s}
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: ${APP_MAIL_HOST:}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${APP_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${APP_MAIL_STARTTLS_ENABLED:true}
          connectiontimeout: ${APP_MAIL_CONNECTION_TIMEOUT_MILLIS:5000}
          timeout: ${APP_MAIL_TIMEOUT_MILLIS:5000}
          writetimeout: ${APP_MAIL_WRITE_TIMEOUT_MILLIS:5000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    mail:
      enabled: ${APP_MAIL_HEALTH_ENABLED:${APP_AUTH_VERIFICATION_MAIL_ENABLED:false}}
    redis:
      enabled: ${APP_REDIS_HEALTH_ENABLED:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger - [%X{traceId}] %msg%n"

app:
  runtime-mode: ${APP_RUNTIME_MODE:prod}
  payment:
    notify-secret: ${APP_PAYMENT_NOTIFY_SECRET:}
    mock-enabled: ${APP_PAYMENT_MOCK_ENABLED:false}
    stripe:
      enabled: ${APP_PAYMENT_STRIPE_ENABLED:false}
      secret-key: ${APP_PAYMENT_STRIPE_SECRET_KEY:}
      endpoint-secret: ${APP_PAYMENT_STRIPE_ENDPOINT_SECRET:}
  search:
    provider: ${APP_SEARCH_PROVIDER:mysql}
    base-url: ${APP_SEARCH_BASE_URL:http://127.0.0.1:9200}
    index-name: ${APP_SEARCH_INDEX_NAME:dzdp_shop_v1}
    fallback-on-error: ${APP_SEARCH_FALLBACK_ON_ERROR:true}
    sync-batch-size: ${APP_SEARCH_SYNC_BATCH_SIZE:50}
    sync-fixed-delay-ms: ${APP_SEARCH_SYNC_FIXED_DELAY_MS:5000}
    sync-initial-delay-ms: ${APP_SEARCH_SYNC_INITIAL_DELAY_MS:10000}
    sync-lock-timeout-seconds: ${APP_SEARCH_SYNC_LOCK_TIMEOUT_SECONDS:300}
    sync-retry-base-seconds: ${APP_SEARCH_SYNC_RETRY_BASE_SECONDS:15}
    sync-retry-max-seconds: ${APP_SEARCH_SYNC_RETRY_MAX_SECONDS:1800}
  infrastructure:
    state-store:
      provider: ${APP_STATE_STORE_PROVIDER:local}
      key-prefix: ${APP_STATE_STORE_KEY_PREFIX:dzdp}
  admin:
    access-token-expire-seconds: ${APP_ADMIN_ACCESS_TOKEN_EXPIRE_SECONDS:7200}
  merchant:
    account: ${APP_MERCHANT_ACCOUNT:merchant_eu_sichuan@example.com}
    password: ${APP_MERCHANT_PASSWORD:merchant123456}
    merchant-id: ${APP_MERCHANT_ID:2001}
    access-token-expire-seconds: ${APP_MERCHANT_ACCESS_TOKEN_EXPIRE_SECONDS:7200}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 2592000
    verification-code:
      mock-enabled: ${APP_AUTH_VERIFICATION_MOCK_ENABLED:false}
      mock-code: ${APP_AUTH_VERIFICATION_MOCK_CODE:}
      expose-mock-code: ${APP_AUTH_VERIFICATION_EXPOSE_MOCK_CODE:false}
      dev-console-enabled: ${APP_AUTH_VERIFICATION_DEV_CONSOLE_ENABLED:false}
      mail:
        enabled: ${APP_AUTH_VERIFICATION_MAIL_ENABLED:false}
        host: ${APP_MAIL_HOST:}
        from: ${APP_AUTH_VERIFICATION_MAIL_FROM:}
        subject: ${APP_AUTH_VERIFICATION_MAIL_SUBJECT:Your verification code}
        brand-name: ${APP_AUTH_VERIFICATION_BRAND_NAME:Dazhongdianping}
      twilio:
        enabled: ${APP_AUTH_VERIFICATION_TWILIO_ENABLED:false}
        account-sid: ${APP_AUTH_VERIFICATION_TWILIO_ACCOUNT_SID:}
        auth-token: ${APP_AUTH_VERIFICATION_TWILIO_AUTH_TOKEN:}
        from: ${APP_AUTH_VERIFICATION_TWILIO_FROM:}
        messaging-service-sid: ${APP_AUTH_VERIFICATION_TWILIO_MESSAGING_SERVICE_SID:}
        api-base-url: ${APP_AUTH_VERIFICATION_TWILIO_API_BASE_URL:https://api.twilio.com}
        route-prefixes: ${APP_AUTH_VERIFICATION_TWILIO_ROUTE_PREFIXES:*}
        excluded-route-prefixes: ${APP_AUTH_VERIFICATION_TWILIO_EXCLUDED_ROUTE_PREFIXES:+86}
      aliyun:
        enabled: ${APP_AUTH_VERIFICATION_ALIYUN_ENABLED:false}
        access-key-id: ${APP_AUTH_VERIFICATION_ALIYUN_ACCESS_KEY_ID:}
        access-key-secret: ${APP_AUTH_VERIFICATION_ALIYUN_ACCESS_KEY_SECRET:}
        sign-name: ${APP_AUTH_VERIFICATION_ALIYUN_SIGN_NAME:}
        template-code: ${APP_AUTH_VERIFICATION_ALIYUN_TEMPLATE_CODE:}
        endpoint: ${APP_AUTH_VERIFICATION_ALIYUN_ENDPOINT:https://dysmsapi.aliyuncs.com}
        region-id: ${APP_AUTH_VERIFICATION_ALIYUN_REGION_ID:cn-hangzhou}
        route-prefixes: ${APP_AUTH_VERIFICATION_ALIYUN_ROUTE_PREFIXES:+86}
    send-code-rate-limit:
      account-short-window-seconds: 60
      account-short-window-max-requests: 1
      account-long-window-seconds: 600
      account-long-window-max-requests: 5
      device-window-seconds: 600
      device-window-max-requests: 3
      ip-window-seconds: 600
      ip-window-max-requests: 10
  file-storage:
    provider: ${APP_FILE_STORAGE_PROVIDER:local}
    base-dir: local-storage/uploads
    max-image-bytes: 5242880
    s3:
      bucket: ${APP_S3_BUCKET:}
      region: ${APP_S3_REGION:us-east-1}
      endpoint: ${APP_S3_ENDPOINT:}
      public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
      access-key: ${APP_S3_ACCESS_KEY:}
      secret-key: ${APP_S3_SECRET_KEY:}
      path-style-access-enabled: ${APP_S3_PATH_STYLE_ACCESS_ENABLED:false}
  push:
    enabled: ${APP_PUSH_ENABLED:false}
    max-attempts: ${APP_PUSH_MAX_ATTEMPTS:3}
    initial-backoff-millis: ${APP_PUSH_INITIAL_BACKOFF_MILLIS:250}
    fcm:
      project-id: ${APP_PUSH_FCM_PROJECT_ID:}
      client-email: ${APP_PUSH_FCM_CLIENT_EMAIL:}
      private-key: ${APP_PUSH_FCM_PRIVATE_KEY:}
      token-url: ${APP_PUSH_FCM_TOKEN_URL:https://oauth2.googleapis.com/token}
      api-base-url: ${APP_PUSH_FCM_API_BASE_URL:https://fcm.googleapis.com}
    apns:
      team-id: ${APP_PUSH_APNS_TEAM_ID:}
      key-id: ${APP_PUSH_APNS_KEY_ID:}
      private-key: ${APP_PUSH_APNS_PRIVATE_KEY:}
      topic: ${APP_PUSH_APNS_TOPIC:}
      endpoint: ${APP_PUSH_APNS_ENDPOINT:}
      production: ${APP_PUSH_APNS_PRODUCTION:false}
