name: release

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - pre
          - prod
      region:
        description: Deployment region
        required: true
        default: CN
        type: choice
        options:
          - CN
          - EU
      release_version:
        description: Optional release version override
        required: false
        type: string

jobs:
  deploy-test:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: test
    env:
      DEPLOY_ENVIRONMENT: test
      DEPLOY_REGION: CN
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_REMOTE_ROOT: ${{ vars.DEPLOY_REMOTE_ROOT }}
      DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
      DEPLOY_WEB_SERVICE: ${{ vars.DEPLOY_WEB_SERVICE }}
      DEPLOY_ADMIN_SERVICE: ${{ vars.DEPLOY_ADMIN_SERVICE }}
      DEPLOY_MERCHANT_SERVICE: ${{ vars.DEPLOY_MERCHANT_SERVICE }}
      DEPLOY_SMOKE_URLS: ${{ vars.DEPLOY_SMOKE_URLS }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PRERENDER_API_BASE_URL: ${{ vars.PRERENDER_API_BASE_URL }}
      PRERENDER_REGION: CN
      APP_RELEASE_VERSION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check test deployment configuration
        id: deployment-config
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -n "$DEPLOY_SSH_HOST" && -n "$DEPLOY_SSH_USER" && -n "$DEPLOY_REMOTE_ROOT" && -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping test deployment because the test environment is not configured."
          fi
      - uses: actions/checkout@v4
        if: steps.deployment-config.outputs.configured == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v4
        if: steps.deployment-config.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        if: steps.deployment-config.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin-web/package-lock.json
            merchant-web/package-lock.json
      - name: Install frontend dependencies
        if: steps.deployment-config.outputs.configured == 'true'
        run: |
          npm ci --prefix web
          npm ci --prefix admin-web
          npm ci --prefix merchant-web
      - name: Make Maven wrapper executable
        if: steps.deployment-config.outputs.configured == 'true'
        run: chmod +x backend/mvnw
      - name: Prepare SSH
        if: steps.deployment-config.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Package release
        id: package
        if: steps.deployment-config.outputs.configured == 'true'
        shell: pwsh
        run: |
          $bundle = ./scripts/ci/package-release.ps1
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Release bundle path was not produced" }
          if (-not (Test-Path -LiteralPath "$bundle.sha256")) { throw "Release bundle checksum was not produced" }
          "APP_RELEASE_BUNDLE=$bundle" >> $env:GITHUB_ENV
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "checksum=$bundle.sha256" >> $env:GITHUB_OUTPUT
          "bundle_name=$([System.IO.Path]::GetFileNameWithoutExtension($bundle))" >> $env:GITHUB_OUTPUT
      - name: Upload test release artifact
        if: steps.deployment-config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Deploy test
        if: steps.deployment-config.outputs.configured == 'true'
        shell: pwsh
        run: ./scripts/ci/deploy-release.ps1

  deploy-pre:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'pre'
    runs-on: ubuntu-latest
    environment: pre
    env:
      DEPLOY_ENVIRONMENT: pre
      DEPLOY_REGION: ${{ inputs.region }}
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_REMOTE_ROOT: ${{ vars.DEPLOY_REMOTE_ROOT }}
      DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
      DEPLOY_WEB_SERVICE: ${{ vars.DEPLOY_WEB_SERVICE }}
      DEPLOY_ADMIN_SERVICE: ${{ vars.DEPLOY_ADMIN_SERVICE }}
      DEPLOY_MERCHANT_SERVICE: ${{ vars.DEPLOY_MERCHANT_SERVICE }}
      DEPLOY_SMOKE_URLS: ${{ vars.DEPLOY_SMOKE_URLS }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PRERENDER_API_BASE_URL: ${{ vars.PRERENDER_API_BASE_URL }}
      PRERENDER_REGION: ${{ inputs.region }}
      APP_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin-web/package-lock.json
            merchant-web/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix admin-web
          npm ci --prefix merchant-web
      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Package release
        id: package
        shell: pwsh
        run: |
          $bundle = ./scripts/ci/package-release.ps1
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Release bundle path was not produced" }
          if (-not (Test-Path -LiteralPath "$bundle.sha256")) { throw "Release bundle checksum was not produced" }
          "APP_RELEASE_BUNDLE=$bundle" >> $env:GITHUB_ENV
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "checksum=$bundle.sha256" >> $env:GITHUB_OUTPUT
          "bundle_name=$([System.IO.Path]::GetFileNameWithoutExtension($bundle))" >> $env:GITHUB_OUTPUT
      - name: Upload pre release artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Deploy pre
        shell: pwsh
        run: ./scripts/ci/deploy-release.ps1

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      DEPLOY_ENVIRONMENT: prod
      DEPLOY_REGION: ${{ inputs.region }}
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_REMOTE_ROOT: ${{ vars.DEPLOY_REMOTE_ROOT }}
      DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
      DEPLOY_WEB_SERVICE: ${{ vars.DEPLOY_WEB_SERVICE }}
      DEPLOY_ADMIN_SERVICE: ${{ vars.DEPLOY_ADMIN_SERVICE }}
      DEPLOY_MERCHANT_SERVICE: ${{ vars.DEPLOY_MERCHANT_SERVICE }}
      DEPLOY_SMOKE_URLS: ${{ vars.DEPLOY_SMOKE_URLS }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PRERENDER_API_BASE_URL: ${{ vars.PRERENDER_API_BASE_URL }}
      PRERENDER_REGION: ${{ inputs.region }}
      APP_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin-web/package-lock.json
            merchant-web/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix admin-web
          npm ci --prefix merchant-web
      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Package release
        id: package
        shell: pwsh
        run: |
          $bundle = ./scripts/ci/package-release.ps1
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Release bundle path was not produced" }
          if (-not (Test-Path -LiteralPath "$bundle.sha256")) { throw "Release bundle checksum was not produced" }
          "APP_RELEASE_BUNDLE=$bundle" >> $env:GITHUB_ENV
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "checksum=$bundle.sha256" >> $env:GITHUB_OUTPUT
          "bundle_name=$([System.IO.Path]::GetFileNameWithoutExtension($bundle))" >> $env:GITHUB_OUTPUT
      - name: Upload prod release artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Deploy prod
        shell: pwsh
        run: ./scripts/ci/deploy-release.ps1
