name: release

permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - test
          - pre
          - prod
      region:
        description: Deployment region (test is fixed to EU)
        required: true
        default: EU
        type: choice
        options:
          - CN
          - EU
      release_version:
        description: Optional release version override
        required: false
        type: string

jobs:
  verify_source:
    name: Verify manual release source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require successful CI for the exact release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/release-source-preflight.ps1

  deploy-test:
    needs: verify_source
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'test' &&
        needs.verify_source.result == 'success'))
    runs-on: ubuntu-24.04
    concurrency:
      group: release-test-EU
      cancel-in-progress: false
    environment: test
    env:
      DEPLOY_ENVIRONMENT: test
      DEPLOY_REGION: EU
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_REMOTE_ROOT: ${{ secrets.DEPLOY_REMOTE_ROOT }}
      DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
      DEPLOY_WEB_SERVICE: ${{ vars.DEPLOY_WEB_SERVICE }}
      DEPLOY_ADMIN_SERVICE: ${{ vars.DEPLOY_ADMIN_SERVICE }}
      DEPLOY_MERCHANT_SERVICE: ${{ vars.DEPLOY_MERCHANT_SERVICE }}
      DEPLOY_SMOKE_URLS: ${{ vars.DEPLOY_SMOKE_URLS }}
      DEPLOY_RUNTIME_ENV_FILE: ${{ secrets.DEPLOY_RUNTIME_ENV_FILE }}
      DEPLOY_DB_DEFAULTS_FILE: ${{ secrets.DEPLOY_DB_DEFAULTS_FILE }}
      DEPLOY_DB_MIGRATION_MODE: ${{ vars.DEPLOY_DB_MIGRATION_MODE }}
      DEPLOY_DB_BASELINE_VERSION: ${{ vars.DEPLOY_DB_BASELINE_VERSION }}
      DEPLOY_RELEASE_RETENTION_COUNT: ${{ vars.DEPLOY_RELEASE_RETENTION_COUNT }}
      DEPLOY_ACCEPTANCE_REPORT_DIR: artifacts/acceptance
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PRERENDER_API_BASE_URL: ${{ vars.PRERENDER_API_BASE_URL }}
      PRERENDER_REGION: EU
      PRERENDER_REGIONS: ${{ vars.PRERENDER_REGIONS }}
      PUBLIC_SITE_URL_CN: ${{ vars.PUBLIC_SITE_URL_CN }}
      PRERENDER_API_BASE_URL_CN: ${{ vars.PRERENDER_API_BASE_URL_CN }}
      PUBLIC_SITE_URL_EU: ${{ vars.PUBLIC_SITE_URL_EU }}
      PRERENDER_API_BASE_URL_EU: ${{ vars.PRERENDER_API_BASE_URL_EU }}
      REMOTE_ACCEPTANCE_WEB_BASE_URL: ${{ vars.REMOTE_ACCEPTANCE_WEB_BASE_URL }}
      REMOTE_ACCEPTANCE_ADMIN_BASE_URL: ${{ vars.REMOTE_ACCEPTANCE_ADMIN_BASE_URL }}
      REMOTE_ACCEPTANCE_MERCHANT_BASE_URL: ${{ vars.REMOTE_ACCEPTANCE_MERCHANT_BASE_URL }}
      REMOTE_ACCEPTANCE_BACKEND_BASE_URL: ${{ vars.REMOTE_ACCEPTANCE_BACKEND_BASE_URL }}
      REMOTE_ACCEPTANCE_REPORT_DIR: artifacts/remote-browser-acceptance
      APP_RELEASE_VERSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_version }}
      APP_RELEASE_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_EXPECTED_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check test deployment configuration
        id: deployment-config
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          seo_configured=true
          if [[ -n "$PRERENDER_REGIONS" ]]; then
            IFS=', ' read -ra seo_regions <<< "$PRERENDER_REGIONS"
            for seo_region in "${seo_regions[@]}"; do
              seo_region_upper="$(printf '%s' "$seo_region" | tr '[:lower:]' '[:upper:]')"
              case "$seo_region_upper" in
                CN) [[ -n "$PUBLIC_SITE_URL_CN" && -n "$PRERENDER_API_BASE_URL_CN" ]] || seo_configured=false ;;
                EU) [[ -n "$PUBLIC_SITE_URL_EU" && -n "$PRERENDER_API_BASE_URL_EU" ]] || seo_configured=false ;;
                *) seo_configured=false ;;
              esac
            done
          else
            [[ -n "$PUBLIC_SITE_URL" && -n "$PRERENDER_API_BASE_URL" ]] || seo_configured=false
          fi
          if [[ -n "$DEPLOY_SSH_HOST" && -n "$DEPLOY_SSH_USER" && -n "$DEPLOY_REMOTE_ROOT" && -n "$DEPLOY_SMOKE_URLS" && -n "$DEPLOY_RUNTIME_ENV_FILE" && -n "$DEPLOY_DB_DEFAULTS_FILE" && -n "$VITE_API_BASE_URL" && -n "$VITE_WS_BASE_URL" && -n "$VITE_STRIPE_PUBLISHABLE_KEY" && "$seo_configured" == true && -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::The manually requested test deployment environment is incomplete."
              exit 1
            fi
            echo "::notice::Skipping automatic test deployment because the test environment is not configured."
          fi
      - name: Check manual test remote acceptance configuration
        if: steps.deployment-config.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PLAYWRIGHT_E2E_ADMIN_ACCOUNT: ${{ secrets.PLAYWRIGHT_E2E_ADMIN_ACCOUNT }}
          PLAYWRIGHT_E2E_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_ADMIN_PASSWORD }}
          PLAYWRIGHT_E2E_MERCHANT_ACCOUNT: ${{ secrets.PLAYWRIGHT_E2E_MERCHANT_ACCOUNT }}
          PLAYWRIGHT_E2E_MERCHANT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_MERCHANT_PASSWORD }}
        run: |
          if [[ -z "$REMOTE_ACCEPTANCE_WEB_BASE_URL" || -z "$REMOTE_ACCEPTANCE_ADMIN_BASE_URL" || -z "$REMOTE_ACCEPTANCE_MERCHANT_BASE_URL" || -z "$REMOTE_ACCEPTANCE_BACKEND_BASE_URL" || -z "$PLAYWRIGHT_E2E_ADMIN_ACCOUNT" || -z "$PLAYWRIGHT_E2E_ADMIN_PASSWORD" || -z "$PLAYWRIGHT_E2E_MERCHANT_ACCOUNT" || -z "$PLAYWRIGHT_E2E_MERCHANT_PASSWORD" ]]; then
            echo "::error::The manually requested test remote acceptance configuration is incomplete."
            exit 1
          fi
      - uses: actions/checkout@v5
        if: steps.deployment-config.outputs.configured == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Validate test remote browser acceptance plan
        if: steps.deployment-config.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          ./scripts/ci/remote-browser-acceptance.ps1 `
            -WebBaseUrl $env:REMOTE_ACCEPTANCE_WEB_BASE_URL `
            -AdminBaseUrl $env:REMOTE_ACCEPTANCE_ADMIN_BASE_URL `
            -MerchantBaseUrl $env:REMOTE_ACCEPTANCE_MERCHANT_BASE_URL `
            -BackendBaseUrl $env:REMOTE_ACCEPTANCE_BACKEND_BASE_URL `
            -ExpectedCommitSha $env:DEPLOY_EXPECTED_COMMIT_SHA `
            -TargetEnvironment $env:DEPLOY_ENVIRONMENT `
            -Region $env:DEPLOY_REGION `
            -BrowserChannel chromium `
            -AllowRemoteMutations `
            -DryRun
      - uses: actions/setup-java@v5
        if: steps.deployment-config.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v5
        if: steps.deployment-config.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin-web/package-lock.json
            merchant-web/package-lock.json
      - name: Install frontend dependencies
        if: steps.deployment-config.outputs.configured == 'true'
        run: |
          npm ci --prefix web
          npm ci --prefix admin-web
          npm ci --prefix merchant-web
      - name: Make Maven wrapper executable
        if: steps.deployment-config.outputs.configured == 'true'
        run: chmod +x backend/mvnw
      - name: Prepare SSH
        if: steps.deployment-config.outputs.configured == 'true'
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Verify test target host readiness
        if: steps.deployment-config.outputs.configured == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/ci/target-host-preflight.ps1
      - name: Package release
        id: package
        if: steps.deployment-config.outputs.configured == 'true'
        shell: pwsh
        run: |
          $bundle = ./scripts/ci/package-release.ps1
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Release bundle path was not produced" }
          if (-not (Test-Path -LiteralPath "$bundle.sha256")) { throw "Release bundle checksum was not produced" }
          "APP_RELEASE_BUNDLE=$bundle" >> $env:GITHUB_ENV
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "checksum=$bundle.sha256" >> $env:GITHUB_OUTPUT
          "bundle_name=$([System.IO.Path]::GetFileNameWithoutExtension($bundle))" >> $env:GITHUB_OUTPUT
      - name: Upload test release artifact
        if: steps.deployment-config.outputs.configured == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Deploy test
        if: steps.deployment-config.outputs.configured == 'true'
        shell: pwsh
        run: ./scripts/ci/deploy-release.ps1
      - name: Install Playwright Chromium for remote acceptance
        if: steps.deployment-config.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run test remote browser acceptance
        if: steps.deployment-config.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        timeout-minutes: 30
        shell: pwsh
        env:
          PLAYWRIGHT_E2E_ADMIN_ACCOUNT: ${{ secrets.PLAYWRIGHT_E2E_ADMIN_ACCOUNT }}
          PLAYWRIGHT_E2E_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_ADMIN_PASSWORD }}
          PLAYWRIGHT_E2E_MERCHANT_ACCOUNT: ${{ secrets.PLAYWRIGHT_E2E_MERCHANT_ACCOUNT }}
          PLAYWRIGHT_E2E_MERCHANT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_MERCHANT_PASSWORD }}
        run: |
          ./scripts/ci/remote-browser-acceptance.ps1 `
            -WebBaseUrl $env:REMOTE_ACCEPTANCE_WEB_BASE_URL `
            -AdminBaseUrl $env:REMOTE_ACCEPTANCE_ADMIN_BASE_URL `
            -MerchantBaseUrl $env:REMOTE_ACCEPTANCE_MERCHANT_BASE_URL `
            -BackendBaseUrl $env:REMOTE_ACCEPTANCE_BACKEND_BASE_URL `
            -ExpectedCommitSha $env:DEPLOY_EXPECTED_COMMIT_SHA `
            -TargetEnvironment $env:DEPLOY_ENVIRONMENT `
            -Region $env:DEPLOY_REGION `
            -BrowserChannel chromium `
            -OutputDirectory $env:REMOTE_ACCEPTANCE_REPORT_DIR `
            -AllowRemoteMutations
      - name: Upload test acceptance evidence
        if: always() && steps.deployment-config.outputs.configured == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ github.run_id }}
          path: ${{ env.DEPLOY_ACCEPTANCE_REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload test remote browser acceptance evidence
        if: always() && steps.deployment-config.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: remote-browser-acceptance-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ github.run_id }}
          path: ${{ env.REMOTE_ACCEPTANCE_REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 30

  deploy-pre:
    needs: verify_source
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'pre' &&
      needs.verify_source.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-pre-${{ inputs.region }}
      cancel-in-progress: false
    environment: pre
    env:
      DEPLOY_ENVIRONMENT: pre
      DEPLOY_REGION: ${{ inputs.region }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_REMOTE_ROOT: ${{ secrets.DEPLOY_REMOTE_ROOT }}
      DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
      DEPLOY_WEB_SERVICE: ${{ vars.DEPLOY_WEB_SERVICE }}
      DEPLOY_ADMIN_SERVICE: ${{ vars.DEPLOY_ADMIN_SERVICE }}
      DEPLOY_MERCHANT_SERVICE: ${{ vars.DEPLOY_MERCHANT_SERVICE }}
      DEPLOY_SMOKE_URLS: ${{ vars.DEPLOY_SMOKE_URLS }}
      DEPLOY_RUNTIME_ENV_FILE: ${{ secrets.DEPLOY_RUNTIME_ENV_FILE }}
      DEPLOY_DB_DEFAULTS_FILE: ${{ secrets.DEPLOY_DB_DEFAULTS_FILE }}
      DEPLOY_DB_MIGRATION_MODE: ${{ vars.DEPLOY_DB_MIGRATION_MODE }}
      DEPLOY_DB_BASELINE_VERSION: ${{ vars.DEPLOY_DB_BASELINE_VERSION }}
      DEPLOY_RELEASE_RETENTION_COUNT: ${{ vars.DEPLOY_RELEASE_RETENTION_COUNT }}
      DEPLOY_ACCEPTANCE_REPORT_DIR: artifacts/acceptance
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PRERENDER_API_BASE_URL: ${{ vars.PRERENDER_API_BASE_URL }}
      PRERENDER_REGION: ${{ inputs.region }}
      PRERENDER_REGIONS: ${{ vars.PRERENDER_REGIONS }}
      PUBLIC_SITE_URL_CN: ${{ vars.PUBLIC_SITE_URL_CN }}
      PRERENDER_API_BASE_URL_CN: ${{ vars.PRERENDER_API_BASE_URL_CN }}
      PUBLIC_SITE_URL_EU: ${{ vars.PUBLIC_SITE_URL_EU }}
      PRERENDER_API_BASE_URL_EU: ${{ vars.PRERENDER_API_BASE_URL_EU }}
      APP_RELEASE_VERSION: ${{ inputs.release_version }}
      APP_RELEASE_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check pre deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          seo_configured=true
          if [[ -n "$PRERENDER_REGIONS" ]]; then
            IFS=', ' read -ra seo_regions <<< "$PRERENDER_REGIONS"
            for seo_region in "${seo_regions[@]}"; do
              seo_region_upper="$(printf '%s' "$seo_region" | tr '[:lower:]' '[:upper:]')"
              case "$seo_region_upper" in
                CN) [[ -n "$PUBLIC_SITE_URL_CN" && -n "$PRERENDER_API_BASE_URL_CN" ]] || seo_configured=false ;;
                EU) [[ -n "$PUBLIC_SITE_URL_EU" && -n "$PRERENDER_API_BASE_URL_EU" ]] || seo_configured=false ;;
                *) seo_configured=false ;;
              esac
            done
          else
            [[ -n "$PUBLIC_SITE_URL" && -n "$PRERENDER_API_BASE_URL" ]] || seo_configured=false
          fi
          if [[ -z "$DEPLOY_SSH_HOST" || -z "$DEPLOY_SSH_USER" || -z "$DEPLOY_REMOTE_ROOT" || -z "$DEPLOY_SMOKE_URLS" || -z "$DEPLOY_RUNTIME_ENV_FILE" || -z "$DEPLOY_DB_DEFAULTS_FILE" || -z "$VITE_API_BASE_URL" || -z "$VITE_WS_BASE_URL" || -z "$VITE_STRIPE_PUBLISHABLE_KEY" || "$seo_configured" != true || -z "$DEPLOY_SSH_PRIVATE_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "::error::The pre deployment environment is incomplete."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin-web/package-lock.json
            merchant-web/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix admin-web
          npm ci --prefix merchant-web
      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Verify pre target host readiness
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/ci/target-host-preflight.ps1
      - name: Package release
        id: package
        shell: pwsh
        run: |
          $bundle = ./scripts/ci/package-release.ps1
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Release bundle path was not produced" }
          if (-not (Test-Path -LiteralPath "$bundle.sha256")) { throw "Release bundle checksum was not produced" }
          "APP_RELEASE_BUNDLE=$bundle" >> $env:GITHUB_ENV
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "checksum=$bundle.sha256" >> $env:GITHUB_OUTPUT
          "bundle_name=$([System.IO.Path]::GetFileNameWithoutExtension($bundle))" >> $env:GITHUB_OUTPUT
      - name: Upload pre release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Deploy pre
        shell: pwsh
        run: ./scripts/ci/deploy-release.ps1
      - name: Upload pre acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ github.run_id }}
          path: ${{ env.DEPLOY_ACCEPTANCE_REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 30

  deploy-prod:
    needs: verify_source
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod' &&
      needs.verify_source.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-prod-${{ inputs.region }}
      cancel-in-progress: false
    environment: prod
    env:
      DEPLOY_ENVIRONMENT: prod
      DEPLOY_REGION: ${{ inputs.region }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_REMOTE_ROOT: ${{ secrets.DEPLOY_REMOTE_ROOT }}
      DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
      DEPLOY_WEB_SERVICE: ${{ vars.DEPLOY_WEB_SERVICE }}
      DEPLOY_ADMIN_SERVICE: ${{ vars.DEPLOY_ADMIN_SERVICE }}
      DEPLOY_MERCHANT_SERVICE: ${{ vars.DEPLOY_MERCHANT_SERVICE }}
      DEPLOY_SMOKE_URLS: ${{ vars.DEPLOY_SMOKE_URLS }}
      DEPLOY_RUNTIME_ENV_FILE: ${{ secrets.DEPLOY_RUNTIME_ENV_FILE }}
      DEPLOY_DB_DEFAULTS_FILE: ${{ secrets.DEPLOY_DB_DEFAULTS_FILE }}
      DEPLOY_DB_MIGRATION_MODE: ${{ vars.DEPLOY_DB_MIGRATION_MODE }}
      DEPLOY_DB_BASELINE_VERSION: ${{ vars.DEPLOY_DB_BASELINE_VERSION }}
      DEPLOY_RELEASE_RETENTION_COUNT: ${{ vars.DEPLOY_RELEASE_RETENTION_COUNT }}
      DEPLOY_ACCEPTANCE_REPORT_DIR: artifacts/acceptance
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PRERENDER_API_BASE_URL: ${{ vars.PRERENDER_API_BASE_URL }}
      PRERENDER_REGION: ${{ inputs.region }}
      PRERENDER_REGIONS: ${{ vars.PRERENDER_REGIONS }}
      PUBLIC_SITE_URL_CN: ${{ vars.PUBLIC_SITE_URL_CN }}
      PRERENDER_API_BASE_URL_CN: ${{ vars.PRERENDER_API_BASE_URL_CN }}
      PUBLIC_SITE_URL_EU: ${{ vars.PUBLIC_SITE_URL_EU }}
      PRERENDER_API_BASE_URL_EU: ${{ vars.PRERENDER_API_BASE_URL_EU }}
      APP_RELEASE_VERSION: ${{ inputs.release_version }}
      APP_RELEASE_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check prod deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          seo_configured=true
          if [[ -n "$PRERENDER_REGIONS" ]]; then
            IFS=', ' read -ra seo_regions <<< "$PRERENDER_REGIONS"
            for seo_region in "${seo_regions[@]}"; do
              seo_region_upper="$(printf '%s' "$seo_region" | tr '[:lower:]' '[:upper:]')"
              case "$seo_region_upper" in
                CN) [[ -n "$PUBLIC_SITE_URL_CN" && -n "$PRERENDER_API_BASE_URL_CN" ]] || seo_configured=false ;;
                EU) [[ -n "$PUBLIC_SITE_URL_EU" && -n "$PRERENDER_API_BASE_URL_EU" ]] || seo_configured=false ;;
                *) seo_configured=false ;;
              esac
            done
          else
            [[ -n "$PUBLIC_SITE_URL" && -n "$PRERENDER_API_BASE_URL" ]] || seo_configured=false
          fi
          if [[ -z "$DEPLOY_SSH_HOST" || -z "$DEPLOY_SSH_USER" || -z "$DEPLOY_REMOTE_ROOT" || -z "$DEPLOY_SMOKE_URLS" || -z "$DEPLOY_RUNTIME_ENV_FILE" || -z "$DEPLOY_DB_DEFAULTS_FILE" || -z "$VITE_API_BASE_URL" || -z "$VITE_WS_BASE_URL" || -z "$VITE_STRIPE_PUBLISHABLE_KEY" || "$seo_configured" != true || -z "$DEPLOY_SSH_PRIVATE_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "::error::The prod deployment environment is incomplete."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin-web/package-lock.json
            merchant-web/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix admin-web
          npm ci --prefix merchant-web
      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Verify prod target host readiness
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/ci/target-host-preflight.ps1
      - name: Package release
        id: package
        shell: pwsh
        run: |
          $bundle = ./scripts/ci/package-release.ps1
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Release bundle path was not produced" }
          if (-not (Test-Path -LiteralPath "$bundle.sha256")) { throw "Release bundle checksum was not produced" }
          "APP_RELEASE_BUNDLE=$bundle" >> $env:GITHUB_ENV
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "checksum=$bundle.sha256" >> $env:GITHUB_OUTPUT
          "bundle_name=$([System.IO.Path]::GetFileNameWithoutExtension($bundle))" >> $env:GITHUB_OUTPUT
      - name: Upload prod release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ steps.package.outputs.bundle_name }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Deploy prod
        shell: pwsh
        run: ./scripts/ci/deploy-release.ps1
      - name: Upload prod acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_REGION }}-${{ github.run_id }}
          path: ${{ env.DEPLOY_ACCEPTANCE_REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 30
