name: mobile-release
run-name: Android ${{ inputs.environment }} ${{ inputs.region }} ${{ inputs.build_name }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment
        required: true
        default: pre
        type: choice
        options:
          - test
          - pre
          - prod
      region:
        description: Application region
        required: true
        default: EU
        type: choice
        options:
          - CN
          - EU
      build_name:
        description: Semantic app version, for example 1.0.0
        required: true
        default: 1.0.0
        type: string
      build_number:
        description: Positive Android version code
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      DZDP_ANDROID_APPLICATION_ID: ${{ vars.DZDP_ANDROID_APPLICATION_ID }}
      DZDP_APP_API_BASE_URL: ${{ vars.DZDP_APP_API_BASE_URL }}
      DZDP_ANDROID_KEYSTORE_BASE64: ${{ secrets.DZDP_ANDROID_KEYSTORE_BASE64 }}
      DZDP_ANDROID_KEY_ALIAS: ${{ secrets.DZDP_ANDROID_KEY_ALIAS }}
      DZDP_ANDROID_STORE_PASSWORD: ${{ secrets.DZDP_ANDROID_STORE_PASSWORD }}
      DZDP_ANDROID_KEY_PASSWORD: ${{ secrets.DZDP_ANDROID_KEY_PASSWORD }}
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_REGION: ${{ inputs.region }}
      RELEASE_BUILD_NAME: ${{ inputs.build_name }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Android release configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DZDP_ANDROID_APPLICATION_ID
            DZDP_APP_API_BASE_URL
            DZDP_ANDROID_KEYSTORE_BASE64
            DZDP_ANDROID_KEY_ALIAS
            DZDP_ANDROID_STORE_PASSWORD
            DZDP_ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured for the selected GitHub Environment."
              exit 1
            fi
          done
          if [[ "$DZDP_ANDROID_APPLICATION_ID" == com.example* ]]; then
            echo "::error::DZDP_ANDROID_APPLICATION_ID must use the production application ID."
            exit 1
          fi
          if [[ ! "$DZDP_APP_API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::DZDP_APP_API_BASE_URL must be an absolute HTTPS URL."
            exit 1
          fi
          if [[ ! "$RELEASE_BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::build_name must be a semantic version such as 1.0.0."
            exit 1
          fi
          if [[ ! "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer."
            exit 1
          fi

      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/dzdp-android-release.jks"
          printf '%s' "$DZDP_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::Decoded Android release keystore is empty."
            exit 1
          fi
          chmod 600 "$keystore_path"
          echo "DZDP_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Verify Flutter app
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter analyze

      - name: Build signed Android App Bundle
        working-directory: app
        run: >-
          flutter build appbundle --release
          --build-name "$RELEASE_BUILD_NAME"
          --build-number "$RELEASE_BUILD_NUMBER"
          --dart-define "API_BASE_URL=$DZDP_APP_API_BASE_URL"
          --dart-define "APP_REGION=$RELEASE_REGION"

      - name: Package Android release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/dzdp-android-artifact"
          artifact_name="dazhongdianping-${RELEASE_ENVIRONMENT}-${RELEASE_REGION}-${RELEASE_BUILD_NAME}+${RELEASE_BUILD_NUMBER}.aab"
          mkdir -p "$artifact_dir"
          cp app/build/app/outputs/bundle/release/app-release.aab "$artifact_dir/$artifact_name"
          signature_log="$RUNNER_TEMP/dzdp-aab-signature.log"
          signature_entries="$RUNNER_TEMP/dzdp-aab-signature-entries.txt"
          if ! jarsigner -verify "$artifact_dir/$artifact_name" > "$signature_log" 2>&1; then
            cat "$signature_log"
            exit 1
          fi
          unzip -Z1 "$artifact_dir/$artifact_name" \
            | grep -E '^META-INF/.*\.(RSA|DSA|EC)$' > "$signature_entries"
          if [[ ! -s "$signature_entries" ]]; then
            echo "::error::Android App Bundle does not contain a signing block."
            exit 1
          fi
          (
            cd "$artifact_dir"
            sha256sum "$artifact_name" > "$artifact_name.sha256"
          )
          jq -n \
            --arg environment "$RELEASE_ENVIRONMENT" \
            --arg region "$RELEASE_REGION" \
            --arg buildName "$RELEASE_BUILD_NAME" \
            --arg buildNumber "$RELEASE_BUILD_NUMBER" \
            --arg applicationId "$DZDP_ANDROID_APPLICATION_ID" \
            --arg apiBaseUrl "$DZDP_APP_API_BASE_URL" \
            --arg commitSha "$GITHUB_SHA" \
            --arg builtAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg artifact "$artifact_name" \
            '{
              environment: $environment,
              region: $region,
              buildName: $buildName,
              buildNumber: $buildNumber,
              applicationId: $applicationId,
              apiBaseUrl: $apiBaseUrl,
              commitSha: $commitSha,
              builtAtUtc: $builtAtUtc,
              artifact: $artifact
            }' > "$artifact_dir/mobile-release-manifest.json"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_label=android-${RELEASE_ENVIRONMENT}-${RELEASE_REGION}-${RELEASE_BUILD_NAME}+${RELEASE_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_label }}
          path: ${{ steps.package.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/dzdp-android-release.jks"
